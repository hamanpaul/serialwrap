# RPC／CLI error_code 權威目錄（ADR-07、spec §9.2、OD-06）。由 P0-T3 建立，對應盤點 docs/rust-refactor/inventory/03-errors.md。
# 計數一律由本檔資料產生；驗證器、規則與測試不得以字面數字斷言碼數（OD-06）。
# 本檔與 session last_error（contracts/session_last_errors.yaml）為獨立命名空間；CREDENTIALS_UNRESOLVED 不得列於本檔。
# 新增、改名或改狀態的碼，須同步 contracts/behavior_changes.yaml 與 SKILL 受管區段。
# uart_tx：none＝未送出任何 UART 位元組即回傳；confirmed＝命令或探測位元組已確定送出；possible＝結果不明，不得假設安全。
# extra_fields 不含共通欄位 ok、error_code、id、version（見盤點 03 §1.1）。
# retryable：yes＝可在條件滿足後重送；no＝不可直接重送；conditional＝視條件；fix_args＝修正參數或設定後再送。
