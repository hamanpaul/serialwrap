  - id: "SC-39"
    kind: "SC"
    title: "0.4.0 setup 遇到 0.3.x 舊 daemon 時改走舊版停止路徑（Rust-only）"
    status: "IMPLEMENTED"
    approval:
      owner: "hamanpaul"
      date: "2026-10-29"
      decision_ref: "OD-48"
      basis: "owner_decision"
    owner_confirmation: "not_required"
    owner_item: null
    default_if_pending: null
    applies_to:
      python: null
      rust:
        stage: "stage-1b"
    approved_at_revision: 7
    spec_refs: ["§12.1", "OD-48"]
    reconciliation_refs: ["SC-23"]
    scope: "rust_only"
    ab_participation: "absolute_only"
    phases: ["P4"]
    case_ids: ["sc39-legacy-daemon-handoff"]
    compatibility_impact: "setup（install／update）對 daemon.handoff_stop 回 METHOD_NOT_FOUND 的 daemon 不再一律 fail-closed：D1 判定全部成立（版本 < 0.4.0，取自拒絕回應、缺漏時 health.status；行程正向辨識為 Python 0.3.x daemon；執行檔、argv[0] 與 script 不在 <install_root>/versions/ 底下）才改走舊版停止路徑，否則維持現行拒絕。停止前檢查其他同 uid daemon、mcu.status flash 與 session.list 忙碌、外部監管者（Linux 以 /proc/<pid>/cgroup 判定：daemon 位於 serialwrap 以外的 systemd service unit 或 system.slice 下其他監管者的 scope 即拒絕，父行程清單為輔助；Windows 以父行程判定），並先寫 install-journal.legacy.json（不含 env）；0.3.2 沒有 admission freeze，檢查與送出 stop 之間的 TOCTOU 為已接受偏離。停止手段：pid 為 systemd unit 的 MainPID 時在 autostart hold 之下 systemctl stop，否則 RPC daemon.stop；不送 SIGKILL／TerminateProcess。已停判準：行程樹結束、無同 uid 行程持有該 session 的 UART（Windows 以行程樹結束推定並標註 holders_status unsupported）、與基準相比沒有新的 serialwrapd，連續維持 5 s；上限 330 s，逾時回 TIMEOUT／legacy_stop_pending 並保留 hold 與 journal；被重拉時重做判定後再停，總共最多 3 次，超過回 relaunch_loop。舊 daemon 停止後任一步失敗：還原入口、config、unit 註冊、enabled 狀態與 current，不自動重啟任何 daemon，報告附 legacy_daemon_stopped、restored 與啟動指令（OD-48 修訂）。成功報告新增 legacy_stop。還原本身失敗時 revert_pending、保留 journal，並以 unrestored 逐項列出未還原項（entries／config／unit／enabled／current）。範圍：「監管顯示 running 卻無可 RPC daemon → DEVICE_STILL_HELD」只套 systemd-user／systemd-system（0.3.2 沒有 windows-task 模式，windows-task 期望不變）；MainPID 相符的 unit 模式與 config 舊模式不一致時停止前 DEVICE_STILL_HELD（reason supervisor_mode_mismatch），hint 要求以 --user／--system 指定實際模式，不另取第二個模式的 hold。supervision-mode set 維持拒絕。不新增錯誤碼與 phase。"
    approval_conditions: "依 OD-48（含 2026-10-29 修訂：失敗不自動重啟舊 daemon）與設計 v2 D1～D10；S1X-c-1（依舊／新模式解析 instance endpoint、safety_check 掃到 socket 不符的同 uid serialwrapd fail-closed）一併實作；legacy 專用中斷注入點另立清單，不加進凍結的 CRASH_POINTS 迴圈。"
    related_decisions: ["OD-48", "OD-49", "OD-51"]
