safety_invariants:
  - id: zero_tx_on_reject
    title: "被拒絕且依契約應為零副作用的請求，外部 TX 必須為零"
    spec_ref: "§11.3"
    # 注意（待決 plan item，見 01-stage0-contracts.md T3 uart_tx 說明）：SESSION_NOT_READY 於 session.attach／session.recover 的 probe 之後回此碼時，probe 位元組可能已送出，不滿足零 TX。本清單依碼推導並保留此碼，以符合 T5 的資料推導測試；P2 zero-TX oracle 不得僅以碼推導，須以 (碼, method) 排除這兩個 method 的 SESSION_NOT_READY（機器可讀排除需 T1 schema 變更，待擁有者與 plan 決定）。
    error_codes: ["ALIAS_NOT_FOUND", "AUTOBOOT_QUIET", "CMD_CONTAINS_NEWLINE", "CMD_NOT_CANCELABLE", "CMD_NOT_FOUND", "CMD_TOO_LONG", "CONSOLE_NOT_FOUND", "DEVICE_ALREADY_BOUND", "DEVICE_NOT_BOUND", "DEVICE_NOT_FOUND", "DEVICE_NOT_PRESENT", "DEVICE_STILL_HELD", "ECHO_ACK_UNSUPPORTED", "FLASHING_BUSY", "FLASH_TARGET_IS_CONSOLE", "FLUSHED_BY_RECOVERY", "FLUSHED_BY_SHUTDOWN", "INTERACTIVE_NOT_FOUND", "INVALID_ARGS", "INVALID_COMPLETION_REGEX", "INVALID_RULE_SCHEMA", "LOCAL_FILE_NOT_FOUND", "LOG_OPEN_FAILED", "METHOD_NOT_FOUND", "NOT_READY", "NO_ACTIVE_CAPTURE", "PROFILE_IS_EXPLICIT", "PROFILE_NOT_COMMAND_CAPABLE", "READY_UNCONFIRMED", "RULE_NOT_FOUND", "SESSION_BUSY", "SESSION_INTERACTIVE_BUSY", "SESSION_NOT_FOUND", "SESSION_NOT_READY", "SESSION_QUEUE_FULL", "SESSION_RECOVERING", "UNKNOWN_PROFILE", "WAL_MISSING"]
    case_ids: ["sc01-recovering-submit-open", "sc02-flashing-submit-open", "sc03-quiet-retry-after-execute-file", "df19-self-test-probe-quiet-fence"]
  - id: no_forbidden_interleave
    title: "不得將不同來源的 bytes 以契約禁止的方式交錯"
    spec_ref: "§11.3"
    error_codes: []
    case_ids: []
  - id: no_stale_context_replay
    title: "Recovery／Release／Reboot／Lease 切換不得回放失效上下文的輸入"
    spec_ref: "§11.3"
    error_codes: ["FLUSHED_BY_RECOVERY", "FLUSHED_BY_SHUTDOWN"]
    case_ids: ["bc02-deferred-context-switch-clear", "bc02-mailbox-stale-input-not-replayed"]
  - id: no_reopen_before_handoff
    title: "舊 I/O worker 未完成交接前，不得另開同一受管端點，亦不得回覆釋放成功"
    spec_ref: "§11.3"
    error_codes: ["DEVICE_STILL_HELD", "DRAIN_STALLED", "SESSION_RECOVERING"]
    case_ids: ["sc04-drain-recovering-release-timeout", "bc04-device-attach-sync-reacquire", "sc05-device-attach-sync-exclusive"]
  - id: no_auto_resend
    title: "已有或可能有裝置副作用的命令不得自動重送"
    spec_ref: "§11.3"
    error_codes: ["BASE64_DECODE_FAILED", "CHECKSUM_MISMATCH", "CHECKSUM_VERIFY_FAILED", "COMMAND_ABORTED_IN_FLIGHT", "COMMAND_FAILED", "CONSOLE_LINE_LIMIT_TOO_SMALL", "DRAIN_STALLED", "EMPTY_RESPONSE", "EXCEPTION", "FORCE_RECOVER_TIMEOUT", "INTERACTIVE_EXPIRED", "INVALID_RESPONSE", "MOVE_FAILED", "MOVE_TIMEOUT", "PROMPT_TIMEOUT", "PROMPT_TIMEOUT_FORCE_RECOVERED", "PROMPT_TIMEOUT_RECOVERED", "PULL_PARSE_FAILED", "SEND_FAILED", "SOCKET_ERROR", "STATE_CHANGED", "TARGET_DECODER_FAILED", "TARGET_DECODER_MISSING", "TARGET_ENCODER_FAILED", "TARGET_ENCODER_MISSING", "TIMEOUT", "TRANSFER_ECHO_STALL", "TRANSFER_PROBE_FAILED", "TRANSFER_TIMEOUT"]
    case_ids: ["bc03-no-auto-resend", "bc03-unknown-outcome-send-failed"]
  - id: insufficient_evidence_not_pass
    title: "證據不足、擷取失敗或測試未完成不得轉為 PASS"
    spec_ref: "§11.3"
    error_codes: []
    case_ids: ["bc01-f12-oracle-progress"]
