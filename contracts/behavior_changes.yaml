    compatibility_impact: "POSIX 以 flock＋TIOCEXCL 取得獨占，並於 TIOCEXCL 後、任何 I/O 前做鎖後 holder 重掃；保證範圍限定為在受控權限、指定裝置存取流程與已驗證的驅動／裝置組合下，避免 serialwrap 實例互相搶讀並拒絕已識別的外部衝突（含 --force）。flock 為 advisory；TIOCEXCL 只阻止後續一般 open、不撤銷既有 handle，且有 CAP_SYS_ADMIN 例外；/proc holder 掃描是診斷快照而非原子鎖，查不到 PID 不代表無 holder。daemon 關閉 tty（release、PROBE 轉正式 bridge、TIOCEXCL 後的失敗路徑）先 TIOCNXCL，PTY master 持續開啟時同一 slave 的一般 open 不得 EBUSY。衝突回 DEVICE_STILL_HELD{pids,holder_unknown}。/proc 不可讀時 holder_unknown:true，不再視為可收回。Windows 占用或原因不明時回 pids:[] 與 holder_unknown:true。人類 console 須經 serialwrap console 連入，不得另開 tty。"
    approval_conditions: "明列 POSIX 保證範圍、Windows `pids:[]`／`holder_unknown:true`；占用與原因不明的存取失敗不得誤表述"
    related_decisions: ["OD-04", "OD-05", "OD-08"]
