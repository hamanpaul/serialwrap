# session last_error 權威目錄（ADR-07、spec §9.3、§10.1）。由 P0-T4 建立，對應盤點 docs/rust-refactor/inventory/03-errors.md §5。
# 與 contracts/error_codes.yaml 為獨立命名空間：本檔的值不計入 RPC／CLI error_code 數目；CREDENTIALS_UNRESOLVED 不得列於 error_codes.yaml。
# promoted_via 表示該值會出現在所列方法回應頂層 last_error 欄位（SC-34 起不再進 error_code）。
# 計數一律由本檔資料產生；驗證器、規則與測試不得以字面數字斷言筆數（OD-06）。
# values 依 value 升冪排序（Python 字串順序）；動態前綴以 kind: dynamic_prefix 表示，value 為 `NAME:*`。
# terminal 不手寫：由 cleared_by（無任何 auto: 項）與 auto_reprobe（兩邊皆 false）推導，T1 驗證器強制一致。
# cleared_by：列出會把該值設回 null 的清除點（03 §5.3）。auto:＝背景迴圈或裝置事件自動觸發；operator:＝由 RPC 方法或 daemon 重啟觸發。
# 清除點判定慣例（審查時請特別核對）：
#   1. reboot 恢復迴圈（sw_core/session_manager.py:3454）由操作者的 reboot 命令啟動並於其內收斂（成功或逾時），成功清除記為 operator:command.submit。
#   2. 裝置重新出現時的自動 attach（sw_core/session_manager.py:2602）會清除裝置狀態類的值（DEVICE_*、REBOUND、CLEARED、BRIDGE_DOWN:*、ATTACH_FAILED:*）；
#      對探測結果類的值（登入、帳密、開機、恢復、REPROBE_FAILED）只以同一探測結果重新設回，不列為清除點。
#   3. agent reboot 的清除點（sw_core/session_manager.py:3610）只在 READY 態觸發，而 READY 名義上 last_error 恆為 null，故不列入任何值。
# detail 規則：LOGIN_FSM_DETAIL_ERRORS 12 值為 rx tail（截尾 300 字元）；TRANSPORT_STALL 為 transport_stall_hint 文字；BOOTLOADER_STUCK 為 matched_prompt；其餘 null。
# logging、detail 等描述欄位之模板字串逐字取自程式 format 字串；T16 以 contracts/daemon_logging.yaml 核對。
# states 含 RECOVERING 者：值由 reboot 恢復迴圈（sw_core/session_manager.py:3441、3466、3432）經 ensure_ready 寫入時，state 仍為 RECOVERING；該迴圈成功收斂（:3454）的清除記為 operator:command.submit。
