# inventory 是程式碼盤點，plans 是實作計畫，p7-evidence 是實作證據，內容大量引用 strftime、Rust format!、Go template。
# 其中的 `{%`、`{{` 會被 Liquid 當成語法，不是讓整站建置失敗，就是吃掉內容。
