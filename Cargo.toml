# serialwrap Rust workspace（P3-T1；依 docs/rust-refactor/plans/rust-architecture.md §1.1、§1.2）。
# VERSION 檔為單一版本來源；`tests/test_rust_workspace_layout.py` 會核對此處版本與 VERSION 一致。
[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.96"
publish = false

# 全部依賴以 `=` 釘版（arch §1.2）。crate 內以 `{ workspace = true }` 引用。
[workspace.dependencies]
indexmap = { version = "=2.11.4" }
fancy-regex = { version = "=0.16.2", default-features = false, features = ["std", "unicode", "perf"] }
yaml-rust2 = { version = "=0.10.4", default-features = false }
crc32fast = { version = "=1.5.0" }
sha2 = { version = "=0.10.9" }
crossbeam-channel = { version = "=0.5.15" }
libc = { version = "=0.2.186" }
windows-sys = { version = "=0.61.2" }
tempfile = { version = "=3.23.0" }
md-5 = { version = "=0.10.6" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
debug = 1
strip = "none"

# dev profile 只把 sha2 以最佳化編譯（test profile 繼承 dev；release profile 不讀此區段，產物不變）。
# `mkbundle.sh --dev` 的 debug bundle 約 230 MiB；`setup` 在預檢（safety_check）之前要驗來源與 staging 各一次，
# 大檔各算兩遍，共約 850 MiB 的 SHA-256。opt-level 0 的 sha2 只有約 60 MiB/s（無 SHA 指令集時的軟體後端約 30 MiB/s），
# 這一步就要 13 s 以上，貼近黑箱更新測試 20 s／30 s 的等待上限，hosted runner 較慢時 6 支測試成批逾時。
# 最佳化後約 2400 MiB/s（軟體後端約 570 MiB/s），同一段降到 1 s 左右。
[profile.dev.package.sha2]
opt-level = 3
