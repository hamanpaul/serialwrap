name: Architecture HTML
on:
  pull_request:
    paths:
      - 'docs/architecture/**'
      - 'tools/architecture_*.py'
      - 'tests/test_architecture_docs.py'
      - 'README.md'
      - '.github/workflows/architecture-html.yml'
permissions:
  contents: read
jobs:
  native-html:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tt-a1i/archify
          ref: a07fa1d5b2a10cbea110c5a2be2817397a301cdc
          path: .archify-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: 來源、語意負控制及逐位元組重建
        run: |
          python -m pytest -q tests/test_architecture_docs.py
          python tools/architecture_review.py --archify-root .archify-engine/archify --output /tmp/serialwrap-architecture-review/delivery.json
      - name: 實際 file 開啟與原生瀏覽器驗收
        run: |
          python tools/architecture_browser.py --html docs/architecture/architecture.html --output /tmp/serialwrap-architecture-review
          export ARCHIFY_CHROME="$(command -v google-chrome)"
          node .archify-engine/archify/bin/archify.mjs visual-check docs/architecture/architecture.html --json > /tmp/serialwrap-architecture-review/visual-check.json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: serialwrap-architecture-review
          retention-days: 14
          path: |
            /tmp/serialwrap-architecture-review
            docs/architecture/architecture.visual-check*
