name: Tests
on: [pull_request]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試相依
        run: python3 -m pip install --disable-pip-version-check pytest pyyaml
      - name: 執行測試套件
        run: python3 -m pytest -q tests/
