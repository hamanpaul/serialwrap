name: Tests
on:
  pull_request:
    # labeled：PR 事後加上 run-windows-com 標籤時才會觸發 windows-com-selfhosted（P2-T13）
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # labeled 事件只為 windows-com-selfhosted 而開，其餘 job 不因加標籤而重跑（P2-T13 審查修正）
    if: github.event.action != 'labeled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 架構證據綁定歷史 revision，測試需讀取原始 Git blob。
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          # 釘 CPython 3.12.3：Stage 1A argparse 相容層的方言基準（arch §7.2、plan §0.7）。
          python-version: "3.12.3"
      - name: 安裝測試相依（預設安裝，不含 [redos] extra）
        # pyserial：讓 #84 PORT-1 的 pyserial 後端單元測試（_PySerialPort read/write/例外轉譯）
        # 在 Linux CI 亦可執行（生產 Linux 預設走 termios 後端，但 CI 需覆蓋 Windows 後端邏輯）。
        # jsonschema：contracts/ 契約測試（tests/test_contracts_*.py）以 Draft 2020-12 驗證 schema，僅 tests/ 使用。
        run: python3 -m pip install --disable-pip-version-check pytest pyyaml pyserial jsonschema==4.10.3
      - name: 執行測試套件（預設安裝，無 re2 → fail-closed 拒絕 ReDoS 類）
        # 覆蓋 #91 預設安裝路徑（無 google-re2）：matcher 走標準 re、schema 對指數＋多項式
        # fail-closed 拒絕；re2 專屬測試以 importorskip 自動跳過。
        run: python3 -m pytest -q tests/
      - name: 安裝 google-re2（[redos] 可選依賴）
        run: python3 -m pip install --disable-pip-version-check google-re2
      - name: 執行測試套件（含 re2 線性引擎）
        # 覆蓋 #91 re2 路徑：matcher 以 re2 線性引擎求值、免疫所有 catastrophic backtracking。
        run: python3 -m pytest -q tests/
      - name: L1 必要集合鎖只增檢查（對 PR base，P2-T13 R5-F3）
        # 基準 rev 的鎖檔中既有的 (set, platform, nodeid) 消失或 selector 改變即失敗；移除須 --allow-removal 並於 PR 說明。
        if: github.event_name == 'pull_request'
        # 累計核准之精確 nodeid 消失（PENDING-OD-S1X-L1-REMOVAL／OD-16 (1)(2)；舊 10 筆 docker／stage0 裁決保留）。
        # 其他移除仍由鎖檢查拒絕；逐名清單與理由見 docs/rust-refactor/owner-decisions-addenda.md。
        run: >-
          python3 tests/acceptance/regen_lock.py --check --base origin/${{ github.base_ref }} --allow-removal
          'cargo:sw-cli::mgmt_layout::windows_switch_running_exe_rename'
          'cargo:sw-cli::mgmt_service::service_non_string_mode_date_is_typeerror_exit1_without_stdout'
          'cargo:sw-cli::mgmt_service::service_non_string_mode_mixed_keys_is_typeerror_exit1_without_stdout'
          'cargo:sw-cli::p4_case_placeholders::df05_daemon_locate_order'
