name: Materialize reviewed architecture candidate
on:
  pull_request:
    paths: ['.github/workflows/architecture-materialize.yml']
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.number == 200 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/architecture-fact-layer'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tt-a1i/archify
          ref: a07fa1d5b2a10cbea110c5a2be2817397a301cdc
          path: .archify-engine
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: 還原已核對的候選與 pinned source hashes
        run: |
          python - <<'PY'
          import base64,hashlib,json,lzma,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'.architecture-transfer/candidate-{i}').read_text().strip() for i in range(1,5))
          raw=lzma.decompress(base64.b64decode(encoded,validate=True),memlimit=134217728)
          assert len(raw)<200000
          assert hashlib.sha256(raw).hexdigest()=='b80b2f82b4ad6fe319bfd777220a5bec1e24866a4aae1bdf581aeabcac78ffb0'
          payload=json.loads(raw)
          expected={'docs/architecture/facts.json','docs/architecture/architecture.json','docs/architecture/README.md','docs/architecture/toolchain.json','tools/architecture_review.py','tools/architecture_browser.py','tests/test_architecture_docs.py','.github/workflows/architecture-html.yml','changelog.d/200-architecture-fact-layer.md'}
          assert set(payload['files'])==expected
          revision=payload['source_revision']
          assert revision=='cf2aaba9004c18a82a6a5e4e0dcc66ea7211aeb1'
          facts=payload['files']['docs/architecture/facts.json']
          assert facts['repository']['revision']==revision
          for record in facts['components']+facts['relations']+facts['boundaries']:
              for a in record['evidence']:
                  path=Path(a['path'])
                  assert not path.is_absolute() and '..' not in path.parts
                  data=subprocess.check_output(['git','show',f'{revision}:{path}']).splitlines(keepends=True)
                  assert 1<=a['line']<=a['end_line']<=len(data)
                  a['excerpt_sha256']=hashlib.sha256(b''.join(data[a['line']-1:a['end_line']])).hexdigest()
          for name,value in payload['files'].items():
              path=Path(name);path.parent.mkdir(parents=True,exist_ok=True)
              text=json.dumps(value,ensure_ascii=False,indent=2)+'\n' if isinstance(value,dict) else value
              path.write_text(text,encoding='utf-8')
          patch=payload['readme_patch'].encode()
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          Path('/tmp/serialwrap-final-files.json').write_text(json.dumps(sorted(expected|{'README.md','docs/architecture/architecture.html'})))
          PY
      - run: python -m pip install pytest pyyaml playwright==1.51.0
      - run: python -m playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: 原生產出與真正 file 瀏覽器驗收
        run: |
          mkdir -p /tmp/serialwrap-architecture-review
          node .archify-engine/archify/bin/archify.mjs deliver architecture docs/architecture/architecture.json docs/architecture/architecture.html --repo-root . --quality showcase --json > /tmp/serialwrap-architecture-review/initial-delivery.json
          python -m pytest -q tests/test_architecture_docs.py
          python tools/architecture_review.py --archify-root .archify-engine/archify --output /tmp/serialwrap-architecture-review/delivery.json
          python tools/architecture_browser.py --html docs/architecture/architecture.html --output /tmp/serialwrap-architecture-review
          export ARCHIFY_CHROME="$(command -v google-chrome)"
          node .archify-engine/archify/bin/archify.mjs visual-check docs/architecture/architecture.html --json > /tmp/serialwrap-architecture-review/visual-check.json
      - name: 建立正式 Git 物件，不移動 branch 或合併 PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PARENT: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import base64,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          parent=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert parent==os.environ['EXPECTED_PARENT']
          api='https://api.github.com/repos/hamanpaul/serialwrap'
          def call(path,data):
              req=urllib.request.Request(api+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          entries=[];proof={}
          for name in json.loads(Path('/tmp/serialwrap-final-files.json').read_text()):
              data=Path(name).read_bytes()
              obj=call('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              entries.append({'path':name,'mode':'100644','type':'blob','sha':obj['sha']})
              proof[name]={'blob_sha':obj['sha'],'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data)}
          retired=subprocess.check_output(['git','ls-files','.architecture-transfer','.github/workflows/architecture-source-review.yml','.github/workflows/architecture-materialize.yml'],text=True).splitlines()
          assert len(retired)==8,retired
          entries.extend({'path':name,'mode':'100644','type':'blob','sha':None} for name in retired)
          base=subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()
          tree=call('/git/trees',{'base_tree':base,'tree':entries})['sha']
          commit=call('/git/commits',{'tree':tree,'parents':[parent],'message':'docs(architecture): 交付 serialwrap 原生流程架構與驗證\n\n還原並驗證 source-pinned facts、原生 JSON/HTML、README 入口與文件測試；移除所有一次性來源及候選傳輸檔。\n\nCo-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>'})['sha']
          receipt={'ready_commit':commit,'parent':parent,'tree':tree,'files':proof,'removed':retired,'ref_updated':False,'merged':False}
          Path('/tmp/serialwrap-architecture-review/git-objects.json').write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n')
          print('READY_COMMIT',commit)
          PY
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        if: always()
        with:
          name: serialwrap-materialized-review
          retention-days: 3
          path: /tmp/serialwrap-architecture-review
