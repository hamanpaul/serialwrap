name: Policy Check
on: [pull_request]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout policy engine
        uses: actions/checkout@v4
        with:
          repository: hamanpaul/paulsha-conventions
          ref: 9e7fabbf0b5eea9ad933fa6798764b723934a0b7 # v1.0.17
          path: .policy-engine

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install universal-ctags
        run: sudo apt-get update -qq && sudo apt-get install -y universal-ctags

      - name: Install policy engine
        run: python -m pip install --disable-pip-version-check ".policy-engine"

      - name: Compute effective labels
        id: labels
        run: |
          # CLAUDE.md 允許 fix/ 前綴分支，自動補上 policy-exempt:branch-name 豁免 R-12
          LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          HEAD="${{ github.head_ref }}"
          if [[ "$HEAD" == fix/* || "$HEAD" == hotfix/* ]]; then
            if [[ -n "$LABELS" ]]; then
              LABELS="$LABELS,policy-exempt:branch-name"
            else
              LABELS="policy-exempt:branch-name"
            fi
          fi
          echo "value=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Run policy check
        run: |
          bash .policy-engine/.github/actions/policy-check/run.sh \
            "$POLICY_PROFILE" \
            "$POLICY_VERSION"
        env:
          POLICY_PROFILE: flat
          POLICY_VERSION: "1.0.17"
          GITHUB_PR_TITLE: ${{ github.event.pull_request.title }}
          GITHUB_PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_PR_LABELS: ${{ steps.labels.outputs.value }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
