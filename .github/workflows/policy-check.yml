name: Policy Check
on:
  pull_request:
    # R-11 驗 PR body；完成測試後勾選驗收項目時必須取新的 event context。
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  policy:
    uses: hamanpaul/paulsha-conventions/.github/workflows/reusable-policy-check.yml@7539d5252159eac50e278ec2a3bcbc5189d396ab # v1.0.18
    with:
      policy_profile: flat
      policy_version: "1.0.18"
      policy_engine_ref: 7539d5252159eac50e278ec2a3bcbc5189d396ab
