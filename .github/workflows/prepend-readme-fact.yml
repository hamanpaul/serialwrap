name: Prepend README Fact

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepend-readme-fact.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepend authority fact
        env:
          FACT: >-
            > **Fact:** `serialwrap` 是 UART / device-session raw physical evidence 的唯一 authority，負責 real-device ownership、single-writer arbitration、WAL 與 recovery semantics。
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("README.md")
          fact = os.environ["FACT"].strip()
          text = path.read_text(encoding="utf-8")
          if not text.startswith(fact):
              path.write_text(f"{fact}\n\n{text}", encoding="utf-8")
          PY
      - name: Commit README
        run: |
          if git diff --quiet -- README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: declare serialwrap physical-evidence authority"
          git push
