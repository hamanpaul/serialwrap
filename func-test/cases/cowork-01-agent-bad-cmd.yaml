meta:
  name: cowork-01-agent-bad-cmd
  category: cowork
  severity: critical
  description: "Agent 送壞命令卡住 → timeout recover → human 操作不受影響 → agent 再次正常"
  tags: ["agent", "bad-command", "recover", "cowork"]

target:
  platform: shell
  boot_banner: "boot done\r\n$ "
  noise:
    enabled: false
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\n$ "
    overrides:
      "bad-hang":
        response: "partial output..."
      "echo ok":
        response: "ok\r\n$ "
      "ls":
        response: "file1 file2\r\n$ "
      "echo after-recover":
        response: "after-recover\r\n$ "

profile:
  prompt_regex: '(?m)^\$ '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 5

steps:
  - action: wait_ready
    timeout_s: 20

  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:stress-test", "--cmd", "bad-hang", "--cmd-timeout", "5"]
    save_as: bad_cmd
    expect:
      ok: true
      has_keys: ["cmd_id"]

  - action: wait_command_done
    cmd_id: "{bad_cmd.cmd_id}"
    timeout_s: 10

  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{bad_cmd.cmd_id}"]
    save_as: bad_status
    expect:
      command.status: error
      command.error_code: PROMPT_TIMEOUT

  - action: wait_ready
    timeout_s: 40

  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:stress-test", "--cmd", "echo after-recover", "--cmd-timeout", "5"]
    save_as: good_cmd
    expect:
      ok: true
      has_keys: ["cmd_id"]

  - action: wait_command_done
    cmd_id: "{good_cmd.cmd_id}"
    timeout_s: 10

  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{good_cmd.cmd_id}"]
    expect:
      command.status: done

  - action: attach_console
    selector: COM0
    label: human-after-recover
    save_as: console1

  - action: detach_console
    console_id: "{console1.client_id}"
    selector: COM0

bridge:
  applicable: true
  compare: full
  windows_caps: [windows_com]
