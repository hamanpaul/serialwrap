---
meta:
  name: s21-partial-tx-abort
  category: l15-scenario
  severity: critical
  description: "bridge 停止讀取 PTY master 使 writer 阻塞時 release，在途大命令終態明確且不重送；wire 該命令 bytes 總量與 WAL TX 一致（Slice 2.1 Task 21，BC-03）"
  scenario:
    revision: "2026-10-28.1"
    seed: 1021
    capabilities: [posix_pty, process_rpc]
    timeout_s: 120
    invariants: [no_auto_resend, insufficient_evidence_not_pass]
    behavior_changes: ["BC-03"]
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: op_begin
    op_id: partial-abort
  # 停止讀取 PTY master（daemon→DUT 方向），kernel buffer 填滿後 daemon writer 阻塞
  - action: bridge_control
    action_name: pause_pump
    params: {dir: TX}
  # "echo " + 15995 個 x = 16000 bytes（加行尾 \n 共 16001 bytes）
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo {15995_x}", "--cmd-timeout", "60"]
    save_as: big
    expect: {ok: true}
  - action: wait_cli_until
    argv: ["cmd", "status", "--cmd-id", "{big.cmd_id}"]
    json_path: "command.status"
    equals: running
    timeout_s: 15
  - action: cli
    argv: ["device", "release", "--selector", "COM0"]
    save_as: rel
    timeout: 30
  - action: bridge_control
    action_name: resume_pump
    params: {dir: TX}
  # release 已回：session 進入 RELEASED
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    equals: RELEASED
    timeout_s: 30
  - action: wait_state
    selector: COM0
    state: RELEASED
    timeout_s: 10
  - action: op_end
    op_id: partial-abort
  # 終態明確，且完整 payload 在 wire serial_read 出現 ≤1 次（不重送）
  - action: assert_command_resolved
    from: big
    timeout_s: 30
    payload: "echo {15995_x}\n"
  - action: wait_cli_until
    argv: ["cmd", "status", "--cmd-id", "{big.cmd_id}"]
    json_path: "command.status"
    in: [done, error, canceled]
    timeout_s: 10
  # OD-39（gaps #4）：BC-03 條件式映射——該 cmd_id 的 TX bytes > 0 ⇒ COMMAND_ABORTED_IN_FLIGHT，= 0 ⇒ FLUSHED_BY_RECOVERY；
  # 兩種情形 TX 總和皆 < 16001（不重送、未寫完）
  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{big.cmd_id}"]
    save_as: big_done
  - action: assert_wal_tx_total
    cmd_id: "{big.cmd_id}"
    lt: 16001
    save_as: big_tx
  - action: assert_when
    value: "{big_tx.tx_bytes}"
    equals: 0
    then:
      - action: assert_value
        value: "{big_done.command.error_code}"
        equals: FLUSHED_BY_RECOVERY
    else:
      - action: assert_value
        value: "{big_done.command.error_code}"
        equals: COMMAND_ABORTED_IN_FLIGHT
  # wire serial_read 與 WAL TX 位元組總量一致（BC-03：寫出幾個 byte 就記幾個 byte）
  - action: assert_compare
