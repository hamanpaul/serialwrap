---
meta:
  name: l15-delayed-reply
  category: l15-scenario
  severity: critical
  description: "命令延遲回覆逾時處理，命令狀態結束於 error 且不重複發送（§15.7.1）"
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: [no_auto_resend]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
  plan:
    schema_version: "dut-plan.v1"
    seed: 1015
    triggers:
      - id: delay-1
        line_contains: "L15_DELAY_1"
        action:
          kind: delay_reply
          delay_ms: 8000
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: op_begin
    op_id: delayed-cmd
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_DELAY_1", "--cmd-timeout", "3"]
    save_as: delay_cmd
  - action: wait_command_done
    cmd_id: "{delay_cmd.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{delay_cmd.cmd_id}"]
    save_as: delay_status
    expect:
      ok: true
      command.status: "error"
      command.error_code: "PROMPT_TIMEOUT"
  - action: cli
    argv: ["cmd", "cancel", "--cmd-id", "{delay_cmd.cmd_id}"]
  - action: op_end
    op_id: delayed-cmd
  - action: assert_wire_contiguous
    payloads: ["echo L15_DELAY_1\n"]
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_AFTER"]
    save_as: after_cmd
  - action: wait_command_done
    cmd_id: "{after_cmd.cmd_id}"
    timeout_s: 15
  - action: assert_compare
