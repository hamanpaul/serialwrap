---
meta:
  name: s21-exclusive-conflict
  category: l15-scenario
  severity: critical
  description: "端點被遵守鎖的外部工具（flock＋TIOCEXCL）持有時 session 不進 READY、attach 回 DEVICE_STILL_HELD 且零 TX（Slice 2.1 Task 21，BC-04、SC-05）"
  scenario:
    revision: "2026-10-28.1"
    seed: 1021
    capabilities: [posix_pty, process_rpc]
    timeout_s: 90
    invariants: [zero_tx_on_reject, no_reopen_before_handoff, insufficient_evidence_not_pass]
    behavior_changes: ["BC-04", "SC-05"]
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
# OD-39（gaps #1／#8／#9）：daemon 啟動前外部工具以 flock＋TIOCEXCL 持有端點（計畫 06 Task 21 原文前置），
# 零 TX 與「從未開埠」窗口自 daemon 啟動前起算。
pre_daemon_steps:
  # daemon 啟動前 DUT 輸出暫存於 bridge，快照無法 settled；窗口只取 mono 時間點（assert_wal_window），
  # 零 TX 改以 assert_wire_offsets 的絕對 serial_read == 0 判定（daemon 不存在時不可能有 serial_read）。
  - action: op_begin
    op_id: prehold
    settle: false
  - action: external_open
    target: session_slave
    hold: flock_tiocexcl
    save_as: pre
    expect: {opened: true}
steps:
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED, ATTACHED]
    timeout_s: 15
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.last_error"
    in: ["ATTACH_FAILED:DeviceHeldError"]
    timeout_s: 15
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{pre.pid}"}}
  - action: op_end
    op_id: prehold
  - action: assert_wire_offsets
    observation: serial_read
    equals: 0
  # 窗口內 COM0 無任何 RX／TX：daemon 從未開埠、未進 ATTACHING／READY（兩個 daemon 皆無狀態 META，見 gaps #9）
  - action: assert_wal_window
    op_id: prehold
    com: COM0
    forbid_dirs: [RX, TX]
  - action: external_close
    from: pre
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: true}
  # 以下為原「release 後外部占用」段（保留，改為第二段）
  - action: wait_ready
    timeout_s: 20
  - action: op_begin
    op_id: release
  - action: cli
    argv: ["device", "release", "--selector", "COM0"]
    expect: {ok: true}
  - action: op_end
    op_id: release
  - action: op_begin
    op_id: conflict
  - action: assert_peer_closed
    at_op: release
    until_op: conflict
  - action: external_open
    target: session_slave
    hold: flock_tiocexcl
    save_as: ext
    expect: {opened: true}
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED, ATTACHED, RELEASED]
    timeout_s: 10
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    save_as: att_held
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{ext.pid}"}}
  # 單點取樣：attach 被拒後此刻不在 READY（「從未進入 READY」runner 無法表達，見 slice21-l15-gaps.md #9）
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED, ATTACHED, RELEASED]
    timeout_s: 10
  - action: op_end
    op_id: conflict
  - action: assert_zero_tx
    op_id: conflict
  - action: external_close
    from: ext
