---
meta:
  name: s23-login-wire-equals-wal
  category: l15-scenario
  severity: critical
  description: "shell 平台完整登入（帳號／密碼／ready probe）後 5 筆命令到達終態；每埠、每 endpoint_generation 的 WAL TX bytes 等於 wire serial_read（secret 依 secret_tx_unlogged 規則只在 wire、不在 WAL），帳號與 secret 在整段 wire 上各恰一次（Slice 2.3 Task 18，§11.3-1）"
  scenario:
    revision: "2026-10-29.1"
    seed: 1023
    capabilities: [posix_pty, process_rpc]
    timeout_s: 120
    invariants: [no_auto_resend, insufficient_evidence_not_pass]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.3"
bridge:
  applicable: true
  only: true
  compare: full
  secrets_from_env_file: {file: p7.env, keys: [P7_PASS]}
target:
  platform: shell
  boot_banner: "\r\nop3 login: "
  login_steps:
    - {expect: "root", respond: "\r\nPassword: "}
    - {expect: "s3cretP7", respond: "\r\nroot@op3:~# "}
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@op3:~# "
profile:
  prompt_regex: '(?m)^root@op3:.*# '
  login_regex: '(?mi)login:\s*$'
  password_regex: '(?mi)password:\s*$'
  user_env: 'P7_USER'
  pass_env: 'P7_PASS'
  env_file: 'p7.env'
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
env_files:
  p7.env: |
    P7_USER=root
    P7_PASS=s3cretP7
steps:
  - action: wait_ready
    timeout_s: 30
  - action: op_begin
    op_id: traffic
  - action: repeat
    count: 5
    steps:
      - action: cli
        argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo S23_{repeat.index}"]
        save_as: "c{repeat.index}"
        expect: {ok: true}
      - action: wait_cli_until
        argv: ["cmd", "status", "--cmd-id", "{c{repeat.index}.cmd_id}"]
        json_path: "command.status"
        in: [done, error, canceled, interactive]
        timeout_s: 20
  - action: op_end
    op_id: traffic
  # 帳號緊接 secret（中間無其他 TX）且整段 serial_read 串流上恰一次；帳號單獨亦恰一次（不重送）
  - action: assert_wire_contiguous
    payloads: ["root\ns3cretP7\n"]
  - action: assert_wire_contiguous
    payloads: ["root\n"]
  - action: assert_compare
