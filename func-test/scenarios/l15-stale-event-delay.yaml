---
meta:
  name: l15-stale-event-delay
  category: l15-scenario
  severity: critical
  description: "延遲回覆在 session recover 後到達，舊命令排隊不重播且 WAL 保留晚到輸出（§15.7.1）"
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: [no_stale_context_replay, insufficient_evidence_not_pass]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
  plan:
    schema_version: "dut-plan.v1"
    seed: 1015
    triggers:
      - id: delay-stale
        line_contains: "L15_STALE"
        action:
          kind: delay_reply
          delay_ms: 6000
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_STALE", "--cmd-timeout", "10"]
    save_as: stale_cmd
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_STALE_Q"]
    save_as: stale_q
  - action: op_begin
    op_id: recover
  - action: cli
    argv: ["session", "recover", "--selector", "COM0"]
    expect: {ok: true}
  - action: op_end
    op_id: recover
  - action: assert_wire_absent
    marker: "L15_STALE_Q"
    after_op: recover
  - action: wait_ready
    timeout_s: 25
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_STALE_AFTER"]
    save_as: cmd_after
  - action: wait_command_done
    cmd_id: "{cmd_after.cmd_id}"
    timeout_s: 15
  - action: assert_wal_marker
    marker: "RESULT:echo L15_STALE"
    dir: "RX"
  - action: assert_compare
