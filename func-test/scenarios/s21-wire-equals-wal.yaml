---
meta:
  name: s21-wire-equals-wal
  category: l15-scenario
  severity: critical
  description: "READY 後 20 筆命令逐筆到達終態；每埠、每 endpoint_generation 的 WAL TX bytes 等於 wire serial_read、wire serial_write 等於 WAL RX bytes（不比 chunk 邊界、seq、時間；Slice 2.1 Task 21，BC-01）"
  scenario:
    revision: "2026-10-27.1"
    seed: 1021
    capabilities: [posix_pty, process_rpc]
    timeout_s: 120
    invariants: [insufficient_evidence_not_pass]
    behavior_changes: ["BC-01"]
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: op_begin
    op_id: traffic
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_01"]
    save_as: c01
    expect: {ok: true}
  - action: wait_cli_until
    argv: ["cmd", "status", "--cmd-id", "{c01.cmd_id}"]
    json_path: "command.status"
    in: [done, error, canceled, interactive]
    timeout_s: 20
