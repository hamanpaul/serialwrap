---
meta:
  name: l15-dut-silent
  category: l15-scenario
  severity: critical
  description: "DUT 靜默不回覆時逾時處理，比較器判定位元組一致（§15.7.1）"
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: [insufficient_evidence_not_pass]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.3"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
  plan:
    schema_version: "dut-plan.v1"
    seed: 1015
    triggers:
      - id: silent-1
        line_contains: "L15_SILENT"
        action:
          kind: silent
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_SILENT", "--cmd-timeout", "3"]
    save_as: silent_cmd
  - action: wait_command_done
    cmd_id: "{silent_cmd.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{silent_cmd.cmd_id}"]
    save_as: silent_status
    expect:
      ok: true
      command.status: "error"
      command.error_code: "PROMPT_TIMEOUT"
  - action: cli
    argv: ["session", "activity", "--selector", "COM0"]
    save_as: act
  - action: cli
    argv: ["session", "recover", "--selector", "COM0"]
    expect: {ok: true}
  - action: wait_ready
    timeout_s: 20
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_SILENT_RECOVERED"]
    save_as: rec_cmd
  - action: wait_command_done
    cmd_id: "{rec_cmd.cmd_id}"
  - action: assert_compare
