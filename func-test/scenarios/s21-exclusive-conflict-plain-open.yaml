---
meta:
  name: s21-exclusive-conflict-plain-open
  category: l15-scenario
  severity: critical
  description: "不取鎖的外部工具（普通 open，模擬 minicom）先持有端點時，attach 與 attach --force 皆回 DEVICE_STILL_HELD{pids,holder_unknown:false} 且零 TX；外部關閉後 attach 成功並 READY（規格 §6.2，BC-04、SC-05）"
  scenario:
    revision: "2026-10-28.1"
    seed: 1021
    capabilities: [posix_pty, process_rpc]
    timeout_s: 90
    invariants: [zero_tx_on_reject, no_reopen_before_handoff, insufficient_evidence_not_pass]
    behavior_changes: ["BC-04", "SC-05"]
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
# OD-39（gaps #1／#8／#9）：daemon 啟動前以普通 open（不 flock、不 TIOCEXCL，模擬 minicom）占用端點；
# OD-47（CHG-S21-OD39-GAP9-01 APPROVED）判定語意：external_close 前埠未成功開啟且未進 READY；三層替代證據為
# 窗口內 COM0 無 RX／TX 的 WAL 紀錄、assert_wire_offsets serial_read == 0、關鍵點狀態取樣（Python 基線 attach 失敗前
# 本就短暫經過 ATTACHING，不列判定）。
pre_daemon_steps:
  # daemon 啟動前 DUT 輸出暫存於 bridge，快照無法 settled；窗口只取 mono 時間點（assert_wal_window），
  # 零 TX 改以 assert_wire_offsets 的絕對 serial_read == 0 判定（daemon 不存在時不可能有 serial_read）。
  - action: op_begin
    op_id: preplain
    settle: false
  - action: external_open
    target: session_slave
    hold: plain
    save_as: pre
    expect: {opened: true}
steps:
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED]
    timeout_s: 15
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.last_error"
    in: ["ATTACH_FAILED:DeviceHeldError"]
    timeout_s: 15
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{pre.pid}"}}
  - action: cli
    argv: ["device", "attach", "--selector", "COM0", "--force"]
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{pre.pid}"}}
  - action: op_end
    op_id: preplain
  - action: assert_wire_offsets
    observation: serial_read
    equals: 0
  - action: assert_wal_window
    op_id: preplain
    com: COM0
    forbid_dirs: [RX, TX]
  - action: external_close
    from: pre
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: true}
  # 以下為原「release 後普通 open 占用」段（保留，改為第二段）
  - action: wait_ready
    timeout_s: 20
  - action: op_begin
    op_id: release
  - action: cli
    argv: ["device", "release", "--selector", "COM0"]
    expect: {ok: true}
  - action: op_end
    op_id: release
  - action: op_begin
    op_id: attach-plain
  - action: assert_peer_closed
    at_op: release
    until_op: attach-plain
  - action: external_open
    target: session_slave
    hold: plain
    save_as: ext
    expect: {opened: true}
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED, RELEASED]
    timeout_s: 10
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    save_as: att_plain
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{ext.pid}"}}
  - action: cli
    argv: ["device", "attach", "--selector", "COM0", "--force"]
    save_as: att_plain_force
    expect: {ok: false, error_code: DEVICE_STILL_HELD, holder_unknown: false, selector: COM0,
             pids: {list_contains: "{ext.pid}"}}
  # 關鍵點狀態取樣（OD-47 三層證據之一）：此刻 session 不在 ATTACHING／READY
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.state"
    in: [DETACHED, RELEASED]
    timeout_s: 10
  - action: op_end
    op_id: attach-plain
  - action: assert_zero_tx
    op_id: attach-plain
  - action: external_close
    from: ext
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: true}
  - action: wait_state
    selector: COM0
    state: READY
    timeout_s: 20
  - action: assert_compare
