---
meta:
  name: win-com-open-exclusive
  category: l15-scenario
  severity: critical
  description: "Windows COM 端點獨占開啟：daemon 持有時外部無法開啟，release 後外部可開啟，外部持有時 attach 被拒且零 TX（§15.7.1）"
  platforms: [windows]
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [windows_com, process_rpc]
    timeout_s: 60
    invariants: [no_reopen_before_handoff, zero_tx_on_reject]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: hold_endpoint
    mode: open
    seconds: 5
    save_as: h_fail
    expect: {opened: false}
  - action: cli
    argv: ["device", "release", "--selector", "COM0"]
    expect: {ok: true}
  - action: hold_endpoint
    mode: open
    seconds: 30
    save_as: h_held
    expect: {opened: true}
  - action: op_begin
    op_id: attach-held
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: false, error_code: DEVICE_STILL_HELD}
  - action: op_end
    op_id: attach-held
  - action: assert_zero_tx
    op_id: attach-held
  - action: release_endpoint
    from: h_held
  - action: cli
    argv: ["device", "attach", "--selector", "COM0"]
    expect: {ok: true}
  - action: wait_ready
    timeout_s: 20
  - action: assert_compare
