---
meta:
  name: l15-half-prompt
  category: l15-scenario
  severity: critical
  description: "提示符分段輸出時命令狀態未完成，後半出現後完成（§15.7.1）"
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: []
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
  plan:
    schema_version: "dut-plan.v1"
    seed: 1015
    triggers:
      - id: half-1
        line_contains: "L15_HALF"
        action:
          kind: half_prompt
          split_at: 7
          gap_ms: 1500
          inject_b64: "G1swbSBLREJHOngNCg=="
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo L15_HALF", "--cmd-timeout", "10"]
    save_as: half_cmd
  - action: wait_wire_marker
    marker: "KDBG:x"
    observation: "serial_write"
    timeout_s: 10
  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{half_cmd.cmd_id}"]
    save_as: mid_status
    expect:
      ok: true
      command.status: "running"
  - action: wait_command_done
    cmd_id: "{half_cmd.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "status", "--cmd-id", "{half_cmd.cmd_id}"]
    save_as: final_status
    expect:
      ok: true
      command.status: "done"
      command.stdout: {contains: "RESULT:echo L15_HALF:OK"}
  - action: assert_compare
