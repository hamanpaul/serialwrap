    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_06"]
    save_as: after06
    expect: {ok: true}
  - action: wait_command_done
    cmd_id: "{after06.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_07"]
    save_as: after07
    expect: {ok: true}
  - action: wait_command_done
    cmd_id: "{after07.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_08"]
    save_as: after08
    expect: {ok: true}
  - action: wait_command_done
    cmd_id: "{after08.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_09"]
    save_as: after09
    expect: {ok: true}
  - action: wait_command_done
    cmd_id: "{after09.cmd_id}"
    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_10"]
    save_as: after10
    expect: {ok: true}
  - action: wait_command_done
    cmd_id: "{after10.cmd_id}"
    timeout_s: 15
  - action: assert_wal_meta
    contains_value: "WAL_RECREATED_AFTER_EXTERNAL_UNLINK"
    loss_flag: true
    has_keys: ["potentially_lost_seq_range", "range_known"]
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_01"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_02"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_03"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_04"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_05"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_06"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_07"
    dir: "TX"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_08"
