---
meta:
  name: s21-credentials-unresolved
  category: l15-scenario
  severity: critical
  description: "DUT 只回 login: 且 profile 宣告的 user_env／pass_env 未提供時，session 停在 ATTACHED、last_error=CREDENTIALS_UNRESOLVED，不對 login prompt 送空帳密（serial_read 零 byte；SC-34）"
  scenario:
    revision: "2026-10-27.1"
    seed: 1021
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: [zero_tx_on_reject, insufficient_evidence_not_pass]
    behavior_changes: ["SC-34"]
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: full}
target:
  platform: shell
  boot_banner: "\r\nlogin: "
  noise: {enabled: false}
  commands:
    default: "\r\nlogin: "
profile:
  prompt_regex: '(?m)[#$]\s*$'
  login_regex: '(?mi)login:\s*$'
  password_regex: '(?mi)password:\s*$'
  # 刻意不提供 env_file，且測試環境不得設定這兩個變數 → 帳密未解析
  user_env: 'SW_S21_UNSET_USER'
  pass_env: 'SW_S21_UNSET_PASS'
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  # 限制：op 窗口只能從第一個 step 起算；daemon 啟動到第一個 step 之間的 TX 由 assert_compare（wire==WAL）涵蓋。
  - action: op_begin
    op_id: cred-unresolved
  - action: wait_state
    selector: COM0
    state: ATTACHED
    timeout_s: 30
  - action: wait_cli_until
    argv: ["session", "list"]
    json_path: "sessions.com=COM0.last_error"
    equals: CREDENTIALS_UNRESOLVED
    timeout_s: 30
  - action: op_end
    op_id: cred-unresolved
  - action: assert_zero_tx
    op_id: cred-unresolved
  - action: assert_compare
