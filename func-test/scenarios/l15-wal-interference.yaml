---
meta:
  name: l15-wal-interference
  category: l15-scenario
  severity: critical
  description: "外部介入 WAL（輪替、外部 unlink、讀取鎖定與 reset）時 daemon 恢復與記錄（§15.7.1）"
  scenario:
    revision: "2026-10-15.1"
    seed: 1015
    capabilities: [posix_pty, process_rpc]
    timeout_s: 60
    invariants: [insufficient_evidence_not_pass]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.1"
bridge: {applicable: true, only: true, compare: none}
target:
  platform: prpl
  boot_banner: "boot done\r\nroot@prplOS:/# "
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@prplOS:/# "
profile:
  prompt_regex: '(?m)^root@prplOS:.*# '
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
steps:
  - action: wait_ready
    timeout_s: 20
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_BEFORE"]
    save_as: w_before
  - action: wait_command_done
    cmd_id: "{w_before.cmd_id}"
  - action: wal_control
    op: unlink_current
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_UNLINK"]
    save_as: w_after
  - action: wait_command_done
    cmd_id: "{w_after.cmd_id}"
  - action: assert_wal_meta
    contains_value: "WAL_RECREATED_AFTER_EXTERNAL_UNLINK"
    loss_flag: true
    has_keys: ["potentially_lost_seq_range"]
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_UNLINK"
    dir: "TX"
  - action: wal_control
    op: hold_reader
    seconds: 5
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_DURING_HOLD"]
    save_as: w_hold
  - action: wait_command_done
    cmd_id: "{w_hold.cmd_id}"
  - action: assert_wal_marker
    marker: "echo WAL_DURING_HOLD"
    dir: "TX"
  - action: wal_control
    op: reset
  - action: wait_ready
    timeout_s: 15
  - action: cli
    argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo WAL_AFTER_RESET"]
    save_as: w_reset
  - action: wait_command_done
    cmd_id: "{w_reset.cmd_id}"
  - action: assert_wal_marker
    marker: "echo WAL_AFTER_RESET"
    dir: "TX"
