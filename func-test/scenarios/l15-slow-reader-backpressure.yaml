    cmd_id: "{bp12.cmd_id}"
    timeout_s: 30
  - action: assert_wire_contiguous
    payloads:
      - "echo L15_BP_01_{15980_x}\n"
      - "echo L15_BP_02_{15980_x}\n"
      - "echo L15_BP_03_{15980_x}\n"
      - "echo L15_BP_04_{15980_x}\n"
      - "echo L15_BP_05_{15980_x}\n"
      - "echo L15_BP_06_{15980_x}\n"
      - "echo L15_BP_07_{15980_x}\n"
      - "echo L15_BP_08_{15980_x}\n"
      - "echo L15_BP_09_{15980_x}\n"
      - "echo L15_BP_10_{15980_x}\n"
      - "echo L15_BP_11_{15980_x}\n"
      - "echo L15_BP_12_{15980_x}\n"
  - action: assert_compare
