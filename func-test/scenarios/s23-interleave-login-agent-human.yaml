---
meta:
  name: s23-interleave-login-agent-human
  category: l15-scenario
  severity: critical
  description: "READY 後 DUT 重回 login 狀態，`session recover` 觸發重新登入；同時 agent 送命令、human raw console 輸入。wire 上兩次登入序列（帳號＋secret）各自連續、不被 agent／human bytes 夾入（§11.3-2「login 與 agent／human 不交錯」；需 P6 human console，Rust BLOCKED-UPSTREAM；Slice 2.3 Task 18）"
  scenario:
    revision: "2026-10-29.2"
    seed: 1023
    capabilities: [posix_pty, process_rpc]
    timeout_s: 150
    invariants: [no_forbidden_interleave, insufficient_evidence_not_pass]
    behavior_changes: []
    expected: PASS
    daemon_slice: "2.3"
bridge:
  applicable: true
  only: true
  compare: full
  secrets_from_env_file: {file: p7.env, keys: [P7_PASS]}
target:
  platform: shell
  boot_banner: "\r\nop3 login: "
  login_steps:
    - {expect: "root", respond: "\r\nPassword: "}
    - {expect: "s3cretP7", respond: "\r\nroot@op3:~# "}
  noise: {enabled: false}
  commands:
    default: "EXEC:{cmd}\r\nRESULT:{cmd}:OK\r\nroot@op3:~# "
profile:
  prompt_regex: '(?m)^root@op3:.*# '
  login_regex: '(?mi)login:\s*$'
  password_regex: '(?mi)password:\s*$'
  user_env: 'P7_USER'
  pass_env: 'P7_PASS'
  env_file: 'p7.env'
  ready_probe: 'echo __READY__${nonce}'
  timeout_s: 15
env_files:
  p7.env: |
    P7_USER=root
    P7_PASS=s3cretP7
steps:
  - action: wait_ready
    timeout_s: 30
  - action: attach_console
    selector: COM0
    label: s23-human
    save_as: con
  # DUT 重回 login 狀態（不經 U-Boot banner，不觸發 quiet）
  - action: dut_control
    action_name: logical_reboot
    params:
      pre_text: "\r\n[S23-REBOOT]\r\n"
      banner_delay_ms: 0
  - action: wait_wire_marker
    marker: "[S23-REBOOT]"
    observation: "serial_write"
    timeout_s: 10
  - action: parallel
    steps:
      - action: cli
        argv: ["session", "recover", "--selector", "COM0"]
        timeout: 45
        save_as: rec
      - action: cli
        argv: ["cmd", "submit", "--selector", "COM0", "--source", "agent:l15", "--cmd", "echo AGENT_P7"]
        save_as: ag
      - action: console_write
        console_id: "{con.client_id}"
        input: "HUMAN_P7\n"
  - action: wait_state
    selector: COM0
    state: READY
    timeout_s: 60
  # 兩次登入（初次＋recover）的完整登入區間——帳號、secret 到 READY nonce probe——各自連續（中間無 human／agent
  # bytes）、恰兩次（審查 P7-f9e90a9-4：只核帳號＋secret 會放過夾在 secret 與 nonce probe 之間的 bytes）。
  # Python 基線實測：agent 命令在 recover 開始前（session 仍 READY）即送出，故不要求 agent bytes 位於 READY 之後。
  - action: assert_wire_contiguous
    payloads: ["root\ns3cretP7\necho __READY__", "root\ns3cretP7\necho __READY__"]
  - action: assert_compare
