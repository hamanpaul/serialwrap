[package]
name = "sw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 業務 actor 與仲裁（Stage 2 承接；P3 為空殼）。
[dependencies]
sw-proto = { path = "../sw-proto" }
sw-pal = { path = "../sw-pal" }
# Slice 2.1（arch §5.4 TxWriter 通道與 §5.7 TX 帳本）。
crossbeam-channel = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
# 測試以 fakes 驅動 sans-IO 核心（Task 0 骨架，arch §9.1）。
sw-pal = { path = "../sw-pal", features = ["test-fakes"] }
# 暫存目錄（Task 15 的 state.json 測試；workspace 釘版）。
tempfile = { workspace = true }

[features]
# 記憶體替身（arch §4）；僅供測試，不得在產品路徑啟用。
test-fakes = ["sw-pal/test-fakes"]
