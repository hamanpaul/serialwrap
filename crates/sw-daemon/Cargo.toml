[package]
name = "sw-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# bin `serialwrapd`（P3 只放空殼；P4 之後承接 daemon 本體）。
[[bin]]
name = "serialwrapd"
path = "src/main.rs"

[features]
# 測試替身與 in-process 測試掛鉤（P5-T19）：只供 `run_with_hooks`／`DaemonHooks`／`TraceEvent` 與測試使用，產品碼不讀任何測試 env。
test-fakes = ["sw-pal/test-fakes"]

[dependencies]
sw-core = { path = "../sw-core" }
sw-proto = { path = "../sw-proto" }
sw-pal = { path = "../sw-pal" }

[dev-dependencies]
sw-pal = { path = "../sw-pal", features = ["test-fakes"] }
