[package]
name = "sw-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# bin `serialwrapd`（P3 只放空殼；P4 之後承接 daemon 本體）。
[[bin]]
name = "serialwrapd"
path = "src/main.rs"

# P8 Task 10：`mcu.patterns`／`mcu.status` 與 `/dev/ttyMCU` 組裝（`sw_pal::fakes`＋`run_with_hooks`）。
[[test]]
name = "mcu_rpc"
required-features = ["test-fakes"]

[[test]]
name = "file_transfer_rpc"
required-features = ["test-fakes"]

# P8 Task 12：有序停止序（`run_with_hooks` trace、`DaemonHooks` 停止序掛鉤、`sw_pal::fakes`）。
[[test]]
name = "shutdown_order"
required-features = ["test-fakes"]

# P8 Task 14：`daemon.handoff_stop`（ServiceRig、`run_with_hooks` trace、`sw_pal::fakes`）。
[[test]]
name = "handoff_stop"
required-features = ["test-fakes"]

[features]
# 測試替身與 in-process 測試掛鉤（P5-T19）：只供 `run_with_hooks`／`DaemonHooks`／`TraceEvent` 與測試使用，產品碼不讀任何測試 env。
# 同時啟用 sw-core 的 test-fakes：`run_with_hooks` 經 `StateStore::spawn_with_hooks` 傳入 commit hook（Task 19）。
test-fakes = ["sw-pal/test-fakes", "sw-core/test-fakes"]

[dependencies]
sw-core = { path = "../sw-core" }
sw-proto = { path = "../sw-proto" }
sw-pal = { path = "../sw-pal" }
# Slice 2.1（framing／ServiceHandler 的停止通道，arch §6.2、§6.3）。
crossbeam-channel = { workspace = true }

[dev-dependencies]
sw-pal = { path = "../sw-pal", features = ["test-fakes"] }
# P7 Task 16：event RPC 測試的規則／事件目錄。
tempfile = { workspace = true }
