[package]
name = "sw-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# bin `serialwrap`。只依賴 sw-proto＋sw-pal，不得連結 sw-core（arch §1.3）。
[lib]
name = "sw_cli"
path = "src/lib.rs"

[features]
test-fakes = []

[[bin]]
name = "serialwrap"
path = "src/main.rs"

# P8 Task 13：windows-task 實跑測試（sw-pal `wintask_runtime.rs`）以獨立行程執行正式 `service stop` 的 harness。
# 只在 `--features test-fakes` 建置；正式 release／bundle 不含此執行檔。
[[bin]]
name = "wintask_stop_harness"
path = "src/test_support/wintask_stop_harness.rs"
test = false
bench = false
required-features = ["test-fakes"]

[dependencies]
sw-proto = { path = "../sw-proto" }
sw-pal = { path = "../sw-pal" }
# Namespace 的插入序字典（argparse 型別宣告，P3-T10 Produces 直接引用 indexmap::IndexMap）。
indexmap = { workspace = true }

[dev-dependencies]
# 不依賴自身來打開 test-fakes（arch §1.3：sw-cli 不得依賴 sw-cli）。
# SERIALWRAP_TEST_／SW_TEST_UPDATE_ 只在 `cargo test --features test-fakes` 啟用。
# 凍結的 `cargo test --workspace` 以行程內 override 編譯委派整合測試；正式 release 不含那些字串。
sw-pal = { path = "../sw-pal", features = ["test-fakes"] }
tempfile = { workspace = true }

# P8 Task 13：正式停止路徑 harness 的 memory_only 測試（`sw_cli::wintask_harness` 只在 test-fakes 建置）。
[[test]]
name = "wintask_scoped_stop"
path = "tests/wintask_scoped_stop.rs"
required-features = ["test-fakes"]
