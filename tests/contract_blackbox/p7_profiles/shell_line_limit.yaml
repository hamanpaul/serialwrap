# max_console_line_chars 黑箱：與 shell.yaml 相同，只多 `max_console_line_chars: 20`（console 單行上限）。
profiles:
  p7-shell-line-limit:
    platform: shell
    prompt_regex: ".*[$#] $"
    login_regex: "(?mi)^.*login:\\s*$"
    password_regex: "(?mi)^password:\\s*$"
    user_env: SW_P7_USER
    pass_env: SW_P7_PASS
    env_file: "${ENV_FILE}"
    timeout_s: 10
    max_console_line_chars: 20
    uart:
      baud: 115200
      data_bits: 8
      parity: N
      stop_bits: 1
      flow_control: none
      xonxoff: false
targets:
  - profile: p7-shell-line-limit
    com: COM0
    device_by_id: "${BY_ID}"
