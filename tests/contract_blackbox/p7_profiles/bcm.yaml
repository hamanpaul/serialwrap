# P7 黑箱（Task 18A）：Broadcom 原生平台；登入後進 CM> CLI，post_login_cmd "sh" 切到 Linux shell（# ）。
# 對應 FakeTarget(login_steps=[…Login:／Password:／CM> …], commands={"overrides": {"sh": {"response": "\\r\\n# "}}}, prompt="# ")。
# ready_probe 省略＝採 config 預設（echo __READY__ 接 nonce 佔位）；代換後檔案不得殘留任何佔位語法。
profiles:
  p7-bcm:
    platform: bcm
    prompt_regex: "(?m)^(?:[ \\t]*|.*[^>#\\s])[>#][ \\t]*$"
    login_regex: "(?mi)login:\\s*$"
    password_regex: "(?mi)password:\\s*$"
    post_login_cmd: "sh"
    user_env: SW_P7_USER
    pass_env: SW_P7_PASS
    env_file: "${ENV_FILE}"
    timeout_s: 15
    bootloader_prompts:
      - "^CFE> $"
    uart:
      baud: 115200
      data_bits: 8
      parity: N
      stop_bits: 1
      flow_control: none
      xonxoff: false
targets:
  - profile: p7-bcm
    com: COM0
    device_by_id: "${BY_ID}"
