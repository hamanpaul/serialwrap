# tests/acceptance/cases.yaml：Stage 0 案例承接清單（P2-T12）
# 單一權威欄位定義見 tests/acceptance/cases.schema.json；凍結鎖見 cases.lock.json（regen_lock.py 唯一寫入者）。
# 來源：docs/rust-refactor/plans/03-stage0-test-infra.md Task 12 承接表；registry 與情境 meta 為事實來源。
# 與計畫的刻意偏離（P2-T12 審查修正，須於 PR 說明）：
#   - rm-topo-*（5 筆，docker 容器封閉拓樸）capabilities 為 [docker]，不含 physical_uart：容器拓樸不需 UART；
#     計畫 Task 12 的 L3 共同欄位（含 physical_uart）與逐列表（docker）不一致，本檔依逐列表與 realhw registry requires=('docker',)。
#   - platform_capabilities（選填，計畫外欄位）：只用於 windows，列出 Windows 實際需要的能力（如 windows_com），
#     取代 Linux 專用的 posix_pty；windows_com 守衛同時檢查 capabilities 與 platform_capabilities.windows。
#   - pending_issue（P1-T21 規則）：f5-deferred-dropped-after-reboot、f10-release-drain-receipt、
#     f10-release-aborts-inflight-command、pt-quiet-ready（P1-OC，OD-14 對應 issue 待擁有者開立）尚無擁有者開立的 issue 號，
#     issues 為空，與 regression registry 逐筆對拍。
#   - f10-release-*：補 posix_throwaway_daemon（經 _run_with_handoff 使用 POSIX-only 的 ThrowawayDaemon），與 f10-creds-* 同族。
#   - win-wal-av-*：evidence 以 scripts/stage0/spike3_win_wal.py 實際產物 <case-id>.json 為準。
schema_version: 1
