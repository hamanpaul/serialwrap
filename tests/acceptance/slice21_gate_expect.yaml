    scenario: SC-37 候選（daemon 端 backend env 強制非原生後端 → exit 1）與「只可新增、不可修改」原則適用範圍（parity #6／#71）
    evidence: "origin/docs/parity-amendments:docs/rust-refactor/plans/parity-amendments-2026-10-26.md#pa-od-1"
  - id: NC-P5-02
    scenario: 承接率斷路器窗口採單一固定窗口；「連續三週內」滾動解讀待擁有者確認（Task 0b）
    evidence: docs/rust-refactor/plans/spec-reconciliation.md
  - id: PA-OD-F67
    scenario: "parity #32：計畫指名的 no_redetect_during_quiet 經公開輸入不可達，改以 session_core::boot_quiet_survives_clear_drain_and_blocks_reattach_probe 替代（審查 4920d90 #1）"
    evidence: docs/rust-refactor/reviews/p5-fix-responses.md#F67
  - id: PA-OD-L15-WAL
    scenario: "P2 凍結情境 l15-wal-interference 為 compare: none，不產 comparison.json，兩個 label 結構上恆為 INSUFFICIENT_EVIDENCE；需裁決改情境（計畫修正）或移出 l15_ab 判定（審查 b7cd852 #2、gaps #7）"
