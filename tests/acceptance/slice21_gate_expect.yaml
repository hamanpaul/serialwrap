# Slice 2.1 出口 gate 的 section 定義（P5-T22；計畫 06 Task 22「判定規則」）。
# 測試類 section 的 PASS 只看 required_set 的凍結 nodeid（R5-F3），nodeid 清單本身只存在於
# tests/acceptance/l1_required.lock.json；本檔只寫 section→集合對應與執行命令，不寫計數門檻。
schema_version: 1
lock_file: tests/acceptance/l1_required.lock.json
freeze_file: tests/acceptance/breaker/slice_2.1.json
blocked_owner_file: tests/acceptance/slice21_bo.yaml
# 承接率斷路器（judge 以 slice_breaker.evaluate 判定 case_uptake；審查 b7cd852 #1）。
breaker_snapshots_file: tests/acceptance/breaker/slice_2.1.snapshots.ndjson
# OD-02 Stage 2 剩餘預估週數：擁有者填值；null 時 case_uptake 為 EVIDENCE_MISSING（不以 0 代入放行）。
# OD-60（2026-10-29）：6 週（起算 2026-10-21）；各 slice 出口依實測速率重新校準一次，已耗＋剩餘 > 24 週照規則重提 OD-02。
stage2_estimate_weeks: 6
runbook: docs/rust-refactor/slice21-owner-runbook.md
# OD-61（2026-10-29）：wal_s1w_perf 的 Linux 門檻以擁有者 WSL2 主機（ext4 vhdx）量測為準（編排者以 throwaway 環境量測後
#   以 SW_GATE_WAL_S1W_IMPORT／SW_GATE_WAL_S1W_HOST 匯入）；雲端 virtio（vm:*）結果只作診斷。匯入證據須為正式參數、
#   env.source_tree_dirty 為 false、env.git_revision 在本分支歷史且其後下列路徑未變更（judge `wal_s1w_verdict`）。
#   sol P5-86b54d8-2：append 熱路徑經 sw-proto（wal_types::crc32_hex、WalRecord::to_line／pyjson、pycompat），整個 crate 列入。
wal_s1w:
  formal_params: {streams: 4, records: 10000, payload: 1024, rotate_bytes: 67108864, prefill_ratio: 0.9375, rate: 0}
  # sol P5-b9ae1d2-1：另含 append／rotate 熱路徑的時鐘（NativeClock：mono_ns／wall_unix_us）、組裝點 native() 與 WalFs／Clock trait。
  # OD-66（擁有者裁決 (a)，2026-10-29）：依 env.virtualization 選門檻（judge 以數值重算延遲門檻，不採證據自報的 §1.2 verdict；
  #   寫入失敗 write_failures>0 與任一流未跨越 rotate 仍判 FAIL、缺欄判 EVIDENCE_MISSING——sol P5-5d5314e-1）。
  #   wsl2：固定門檻，且每項不劣於同主機同時段的 Python 基線（wal_microbench.py，SW_GATE_WAL_S1W_PY_BASELINE 一併匯入）；
  #   native：規格 §1.2 原門檻（原生 Linux／Windows 正式量測，BO）。須與 slice21_gate_judge.WAL_S1W_HOST_THRESHOLDS 一致。
  host_thresholds:
    wsl2: {append_p50_ms: 0.050, append_p95_ms: 0.100, append_p99_ms: 0.200, rotate_max_ms: 100.0,
           not_worse_than_python_baseline: true, source: "OD-66（2026-10-29，WSL2 另訂門檻）"}
    native: {append_p50_ms: 0.005, append_p95_ms: 0.010, append_p99_ms: 0.020, rotate_max_ms: 3.0,
             not_worse_than_python_baseline: false, source: "serialwrap-rust-spec-final.md §1.2"}
  relevant_paths: [crates/sw-core/src/wal.rs, crates/sw-core/examples/wal_s1w.rs, crates/sw-pal/src/wal_fs.rs,
                   crates/sw-pal/src/wal_fs, crates/sw-pal/src/fs_ops.rs, crates/sw-pal/src/fs_ops, Cargo.lock, rust-toolchain.toml,
                   Cargo.toml, crates/sw-core/Cargo.toml, crates/sw-pal/Cargo.toml, crates/sw-proto,
                   crates/sw-pal/src/clock.rs, crates/sw-pal/src/clock, crates/sw-pal/src/lib.rs, crates/sw-pal/src/traits.rs]
parity:
  # #104：逐列狀態檔；來源文件位置與 sha256 記在狀態檔內。
  status_file: tests/acceptance/slice21_parity_status.yaml
# #103：pytest_full 另須通過 Task 0b 的 Python 基線 parity 集合。
# OD-55（2026-10-29）：s21_core.linux 的 cap_posix_pty__* 移入 s21_gate:cap_posix_pty（selector `--ignored cap_posix_pty__`），
#   由 linux_cap_posix_pty section（cargo_l1_results.py --caps posix_pty）實跑承擔。其餘 linux 能力集合
#   s21_gate:cap_{sys_admin,windows_native,interactive_desktop,supervisor_runtime} 需 CAP_SYS_ADMIN／原生 Windows／
#   互動桌面／systemd 監管執行期；P5 第 6 輪 SPEC-GAP #2（編排者裁決）起各有一個 section（linux_cap_<cap>），gate 先探測能力，
#   具備才以 --caps <cap> 實跑，否則記 EVIDENCE_MISSING 並標所需能力（sys_admin／supervisor_runtime → BLOCKED-OWNER＋實跑方式；
#   windows_native／interactive_desktop → LOCAL-WINDOWS-TODO），不得記 PASS（judge CAPABILITY_SECTIONS）。
# SPEC-GAP #1（編排者裁決）：s21_gate:py_parity（凍結，selector 只有 1 筆）不改不刪、仍由 pytest_full 承擔；新集合
#   s21_gate:py_parity_full（完整 selector＝舊集合全部 nodeid）由 py_parity section 以其 selector 實跑。
#   s21_core.windows 的能力列待 Windows 原生收集登記 s21_gate:cap_<cap>.windows 後才移除（LOCAL-WINDOWS-TODO）。
additional_required_sets:
  pytest_full: ["s21_gate:py_parity"]
  linux_cap_posix_pty: ["s21_gate:cap_posix_pty"]
sections:
  - {name: cfg_boundary, kind: non_test, required_set: null, command: "python3 scripts/rust/check_cfg_boundary.py"}
  - {name: linux_l1, kind: test, platform: linux, required_set: s21_core,
     command: "python3 scripts/rust/cargo_l1_results.py --platform linux --out <run>/linux_l1/l1-results.json -- --workspace --features test-fakes -- --skip cap_"}
  - {name: linux_cap_posix_pty, kind: test, platform: linux, required_set: "s21_gate:linux_cap_posix_pty",
     command: "python3 scripts/rust/cargo_l1_results.py --platform linux --caps posix_pty --out <run>/linux_cap_posix_pty/l1-results.json -- -p sw-pal --features test-fakes"}
  - {name: linux_cap_sys_admin, kind: test, platform: linux, required_set: "s21_gate:cap_sys_admin",
     command: "能力探測（euid 0 且 CapEff 含 CAP_SYS_ADMIN）通過時：python3 scripts/rust/cargo_l1_results.py --platform linux --caps sys_admin --out <run>/linux_cap_sys_admin/l1-results.json -- -p sw-pal --features test-fakes"}
  - {name: linux_cap_windows_native, kind: test, platform: linux, required_set: "s21_gate:cap_windows_native",
     command: "linux 主機恆不具備（原生 Windows）：記 EVIDENCE_MISSING（LOCAL-WINDOWS-TODO）"}
  - {name: linux_cap_interactive_desktop, kind: test, platform: linux, required_set: "s21_gate:cap_interactive_desktop",
     command: "linux 主機恆不具備（Windows 互動 console）：記 EVIDENCE_MISSING（LOCAL-WINDOWS-TODO）"}
  - {name: linux_cap_supervisor_runtime, kind: test, platform: linux, required_set: "s21_gate:cap_supervisor_runtime",
     command: "能力探測（systemctl --user is-system-running 為 running／degraded）通過時：python3 scripts/rust/cargo_l1_results.py --platform linux --caps supervisor_runtime --out <run>/linux_cap_supervisor_runtime/l1-results.json -- -p sw-pal --features test-fakes"}
  - {name: windows_native_l1, kind: test, platform: windows, required_set: s21_core,
     command: "scripts/rust/win-test.sh --package sw-pal --package sw-core --package sw-daemon"}
  - {name: windows_cap_windows_com, kind: test, platform: windows, required_set: "s21_gate:windows_cap_windows_com",
     allowed_missing_bo: BO-S21-01, command: "scripts/rust/win-test.sh --caps windows_com --package sw-pal（需 --with-com-pair 與 SW_TEST_COM_PAIR）"}
  - {name: blackbox_python, kind: test, platform: linux, required_set: "s21_gate:blackbox_python",
     command: "python3 -m pytest -q tests/contract_blackbox/slice21 -m cap_posix_pty（Python daemon）"}
  - {name: blackbox_rust, kind: test, platform: linux, required_set: "s21_gate:blackbox_rust",
     command: "Task 20 Step 2 命令（SERIALWRAP_DAEMON_IMPL=rust）"}
  - {name: existing_suites_rust, kind: test, platform: linux, required_set: "s21_gate:existing_suites_rust",
     command: "Task 20 既有套件兩條 pytest 命令＋三次 func-test/runner.py --case <id>"}
  - {name: l15_ab, kind: non_test, required_set: null, command: "Task 21 L1.5 命令（SERIALWRAP_GATE=1）"}
  - {name: event_latency, kind: non_test, required_set: null, command: "Task 21 event_latency 三輪"}
  - {name: wal_s1w_perf, kind: non_test, required_set: null,
     command: "cargo run --release -p sw-core --example wal_s1w -- --out <run>/wal_s1w_perf/wal_s1w.json",
     note: "門檻逐字取規格 §1.2（Linux p50≤0.005／p95≤0.01／p99≤0.02 ms、rotate≤3 ms）；Windows 原生與 EDR 下正式量測屬 BO-S21-14"}
  - {name: case_uptake, kind: non_test, required_set: null, command: "slice_breaker.acceptance_rate（Task 0b）"}
  - {name: py_parity, kind: test, platform: linux, required_set: "s21_gate:py_parity_full",
     command: "SW_RESOURCE_REPORT=<run>/py_parity/l1-results.json python3 -m pytest <s21_gate:py_parity_full selector.argv>"}
  - {name: pytest_full, kind: test, platform: linux, required_set: "s21_gate:pytest_full",
     command: "SW_RESOURCE_REPORT=<run>/pytest_full/resource-report.json python3 -m pytest -q tests/ --junitxml=<run>/pytest_full/junit.xml"}
  - {name: policy_check, kind: non_test, required_set: null, command: "python3 -m policy_check --repo ."}
