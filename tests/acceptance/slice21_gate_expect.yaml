      - {section: linux_l1, nodeid: "cargo:sw-core::wal_writer::rotate_before_write_at_threshold_utc_suffix"}
      - {section: linux_l1, nodeid: "cargo:sw-core::wal_writer::reset_renames_nonempty_files_independent_suffix"}
      - {section: linux_l1, nodeid: "cargo:sw-core::wal_writer::external_unlink_writes_recreate_meta_then_record"}
