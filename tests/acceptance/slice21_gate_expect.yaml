    evidence: docs/rust-refactor/slice21-l15-gaps.md
  - id: PA-OD-L15-GAPS
    scenario: "s21 情境中 runner 仍無法表達的計畫斷言（gaps #1、#3～#5、#8～#10）；裁決前 gate 的 l15_ab 不計 PASS（EVIDENCE_MISSING；審查 c0d221f #3）"
    evidence: docs/rust-refactor/slice21-l15-gaps.md
  - id: PA-OD-REPROBE
    scenario: "readiness reprobe／#162 再確認 tick（08 計畫 P7-T5，P7 已交付 reprobe.rs）被 Slice 2.1 L1.5 l15-delayed-reply（P2 凍結）、s21-reboot-minimal-guard 與 Slice 2.2 func-test cowork-01-agent-bad-cmd 依賴；Rust 於 PROMPT_TIMEOUT／reboot 後不回 READY。裁決：backport P7-T5 至 P5（Slice 2.1），或將上述案例移至 2.3 gate（上游缺口 U-01）"
    evidence: docs/rust-refactor/reviews/p5-fix-responses.md#上游缺口-u-01
  - id: PA-OD-T20
    scenario: "Task 20 黑箱 11 案與基線／計畫不符（7 案 Python 與 Rust 一致但違反案例斷言、2 案 Python 基線缺陷候選或計時敏感、1 案只適用 Rust、1 案 TX 窗口設計缺陷）；逐案根因與建議見交付報告，裁決前不放寬斷言、不改 skip"
    evidence: docs/rust-refactor/reviews/p5-t20-blackbox-report.md
