# P4 驗收案例綁定映射表（P4-T1 建立；Rust 節點使用 `<crate>::<test file>::<fn>`，pytest 使用 node id 並加 `@pytest.mark.case`）。
# 每個必要案例都須綁定正式承接測試；舊占位節點已由各 P4 Task 的實際測試取代，不得計為證據。
