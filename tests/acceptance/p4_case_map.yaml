# P4 驗收案例綁定映射表（P4-T1 建立；承接測試以 Rust `<crate>::<test file>::<fn>`，pytest 以 node id 並加 `@pytest.mark.case`）。
# 占位節點（sw-cli::p4_case_placeholders::*）為測試作者尚未交付之承接測試的暫置節點；check_p4_cases.py 不接受只綁占位節點的案例作為證據。
# 注意：sc20／sc21 的正式承接依賴 P1 的 `daemon restart`／`remote stop` Python parser（P1 未在本分支），在 P1 同步前不得視為就緒。
