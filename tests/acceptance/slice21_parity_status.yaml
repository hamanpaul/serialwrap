#   §1 總表（id 為 `#N`）與 §2 未測行為表（id 為稽核 ID，原樣保留「（部分）」字樣）中「承接 Phase/Task」欄含 P5 者，共 105 列。
# 判定器 scripts/rust/slice21_gate_judge.py 的規則（不得預設 PASS）：
#   - 來源文件可得時，以文件重新抽出 P5 列並與本檔逐列比對：文件有而本檔無 → INCOMPLETE（無標記）；
#     source_sha256 與文件不符 → 全段 INCOMPLETE（須重新核對後更新本檔）。
#   - status 只能是 PASS／BLOCKED-OWNER／OWNER-DECISION-PENDING／INCOMPLETE。
#   - PASS 必須附 tests（nodeid）；且每個 nodeid 須在本次 gate 已載入的 l1-results 中恰為 passed，否則降為 INCOMPLETE。
#   - BLOCKED-OWNER 必須附 bo（BO-S21-NN，須存在於 tests/acceptance/slice21_bo.yaml）。
#   - 任一列為 INCOMPLETE → gate verdict INCOMPLETE。
# 初填依據（2026-10-27，分支 p5work @ 8a7986e；同日 P5 審查修正輪更新 #3／#4／#32／#38／#46／#47／#52／#68／#72／A-88／A-92／D-106／F-W13）：Linux `cargo_l1_results.py -- --workspace --features test-fakes -- --skip cap_`
#   逐案結果（P5-T19～T21 未完成）、`grep` 測試函式是否存在、`tests/acceptance/l1_required.lock.json` 的 s21_core／s21_gate:py_parity。
#   PASS 只表示「計畫指名的測試存在且本次 Linux 執行 passed」；Windows 原生證據仍由 gate 的 windows_native_l1 補齊。
