  stuck_attached:
    status: frozen
    frozen_at: '2026-10-15T00:00:00+00:00'
    decision: OD-09
    total_s: not_higher_than_baseline
    longest_s: not_higher_than_baseline
    granularity:
    - platform
    - board
    bounds_rule: 候選上界 ≤ 基線下界 → PASS；候選下界 > 基線上界 → FAIL；其餘 INSUFFICIENT_EVIDENCE
