- OD-09
- OD-10
- OD-13
- OD-94
- OD-103
- OD-107
workload:
  engine_case: lr-mixed
  engine_files:
  - realhw/cases/longrun.py
  min_continuous_duration_s: 86400
  allow_segment_stitching: false
  snapshot_interval_s: 300
  observer_interval_s: 10
  max_observation_gap_factor: 2.0
  observation_gap_tolerance_s: 1.0
  windows_excl_probe_interval_s: 300
counting:
  status: frozen
  frozen_at: '2026-10-15T00:00:00+00:00'
  pair_key:
  - source
  - round
  expected_reject_kinds:
  - busy
  expected_reject_error_codes:
  - SESSION_INTERACTIVE_BUSY
  expected_reject_by_mode:
    interactive:
    - SESSION_BUSY
  unresolved_policy: count_as_unexpected_error
  worker_error_policy: count_as_unexpected_error
  definitions:
    submitted: kind == submit
    completed: kind == done，或 kind == bg_result 且 status == done（background 以執行期收斂即時寫入的
      bg_result 為準；submit_accepted 不算完成；bg_lost 不算完成）
    bg_lost: kind == bg_lost（產品 history 淘汰前測試端未取得結果；不是終態，該 pair 計入 unresolved，並使 background_result_coverage
      判 INSUFFICIENT_EVIDENCE）
    expected_rejects: kind in expected_reject_kinds，或 kind == error 且 error_code/detail
      屬 expected_reject_error_codes，或 mode 的 expected_reject_by_mode[mode] 含 error_code/detail（OD-103：interactive
      的 SESSION_BUSY 為預期拒絕）
    unexpected_errors: kind == error 且非 expected reject；加上 kind == bg_result 且 status
      ∈ {error, canceled}；加上 worker_error（每個 (source, round) 至多計 1 次）
    unresolved: submit 之後同 (source, round) 沒有 done／error／busy／worker_error／bg_result
      終態（bg_lost、bg_slow、bg_poll_error、bg_drain 都不是終態；已計入 worker_error 的 pair 不再計
      unresolved，避免分子重複）
    accepted: submitted - expected_rejects
    error_rate: (unexpected_errors + unresolved) / accepted
    effective_duration_s: events stop.t - start.t，扣除 observer 判定該板非 READY 的確定區間（兩端樣本皆非
      READY）；逐板計算
    effective_hour: effective_duration_s / 3600（逐板）；throughput = completed / effective_hour
thresholds:
  unexpected_cmd_error_rate:
    status: frozen
    frozen_at: '2026-10-15T00:00:00+00:00'
    decision: OD-09
    max_ratio: 0.01
    relative: not_higher_than_baseline
    granularity:
    - platform
    - board
    - source
  effective_throughput:
    status: frozen
    frozen_at: '2026-10-15T00:00:00+00:00'
    decision: OD-09
    metric: completed per effective hour
    min_ratio_of_baseline: 0.95
    granularity:
