# 本機組態（#122）——機器特定值；R-21：勿寫絕對 home 路徑（一律 ~ 或 Path.home()）。
# harness 主要用 com/serial/busid；platform/profile 僅供 case 判讀。
# busid 換線會變：每輪跑前 usbipd list 驗證存在（config 只存 serial→期望 COM 映射）。
boards:
  - com: COM0
    alias: dut-prpl
    serial: AC01QZT0
    busid: "8-1"
    platform: prpl
  - com: COM1
    alias: sta-prpl
    serial: AQ00OAQ7
    busid: "8-2"
    platform: brcm        # 現為 brcm/BDK（曾為 prpl，alias 沿用歷史命名）
    profile: brcm-template
usbipd_exe: /mnt/c/Program Files/usbipd-win/usbipd.exe
tmux_prefix: realhw
timeouts:
  ready_wait_s: 180
  reboot_wait_s: 300
  human_active_window_s: 60
longrun:
  snapshot_interval_s: 300
  agent_workers: 4
