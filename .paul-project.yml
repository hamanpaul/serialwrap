policy_profile: flat
policy_version: "1.0.5"
# 內容分類（R-21）：serialwrap 為通用序列工具、無雇主機密 → 維持 public
tier: shareable
code_paths:
  - "sw_core/**"
  - "sw_mcp/**"
  - "tools/**"
  - "tests/**"
  - "profiles/**"
  - "serialwrap"
  - "serialwrapd.py"
  - "serialwrap-mcp"
  - "install.sh"
cli:
  - command: "./serialwrap"
    help_args: ["--help"]
    reflected_in: "README.md"
    marker: "serialwrap-help"
