[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "serialwrap"
dynamic = ["version"]
description = "UART broker daemon + CLI（多 agent/human 共用序列埠）"
requires-python = ">=3.10"
# pyserial 為 Windows 序列埠後端（sw_core/serial_port.py 的 _PySerialPort）的執行期依賴（#84 PORT-1）；
# Linux/WSL 預設走 termios 後端不需要它，故僅在 Windows 自動安裝（亦可手動裝以用 SERIALWRAP_SERIAL_BACKEND=pyserial）。
dependencies = [
    "PyYAML>=6",
    "pyserial>=3; sys_platform == 'win32'",
]

[project.optional-dependencies]
# 事件規則 regex 改用 google-re2 線性引擎，免疫 catastrophic backtracking（ReDoS，含 #91 多項式類）。
# 未安裝時 matcher 自動退回標準 re + schema AST 拒絕 + 輸入封頂的既有防護。
redos = ["google-re2"]
# Windows one-file 打包工具（Task 12，#84 PORT-4）；僅開發/CI 建置時需要。
dev = ["pyinstaller>=6"]

[project.scripts]
serialwrap = "sw_core.cli:main"
serialwrapd = "sw_core.daemon:main"

[tool.setuptools]
packages = ["sw_core", "sw_core.event_engine", "sw_core.assets"]

[tool.setuptools.package-data]
"sw_core.assets" = ["profiles/*", "tools/*", "skill/**/*"]

[tool.setuptools.dynamic]
version = { file = ["VERSION"] }
